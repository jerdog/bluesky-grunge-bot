name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing here touches Cloudflare or Bluesky: no secrets are needed, and none
# should be added. Deploys stay a local operation through ./scripts/cf.sh, which
# pins the target account interactively.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.x for `node:sqlite`, which schema.test.ts uses to run the real SQL
          # against the real schema.sql.
          node-version: "22"
          cache: npm

      # `npm install`, not `npm ci`, on purpose. `npm ci` aborts unless the
      # lockfile matches package.json exactly, and a lockfile regenerated on
      # macOS legitimately differs from what a linux runner resolves — npm omits
      # optional deps that don't apply to the host platform (that is exactly how
      # @emnapi/* went missing and red-lit a run that had no real problem).
      # Failing CI on that tells us nothing about the code. `install` still
      # honours the lockfile when it is in sync, and this matches what
      # `cf.sh deploy` runs locally, so CI and deploy resolve deps identically.
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test

      # Bash + real SQLite via a Python fake-wrangler shim. Catches migrations
      # that are valid bash but invalid SQL — the vitest suite mocks D1 and
      # cannot see those.
      - run: npm run test:migrations
